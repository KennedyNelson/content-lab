<!doctype html><html><head><meta name="size" content="1080x1350"><meta charset="utf-8"><link rel="stylesheet" href="{{brand}}"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--fg);font-family:var(--font-body)}.d{font-family:var(--font-display);text-transform:uppercase;line-height:.92;letter-spacing:.01em}.acc{color:var(--accent)}.photo{background:var(--panel) center/cover no-repeat}.pill{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;text-transform:uppercase;letter-spacing:.08em}</style>
<style>body{width:1080px;height:1350px;position:relative;overflow:hidden}.photo{position:absolute;inset:0 0 340px 0;background-image:url('{{image}}')}.fade{position:absolute;left:0;right:0;top:700px;height:310px;background:linear-gradient(transparent,var(--bg))}.t{position:absolute;left:70px;right:70px;bottom:70px}.t .d{font-size:150px}.sub{font-size:34px;margin-top:22px;opacity:.85;font-weight:600}.tag{position:absolute;left:70px;top:70px;font-size:28px;padding:12px 26px}.h{position:absolute;right:70px;top:78px;font-size:28px;font-weight:700;opacity:.9}</style></head><body>
<div class="photo"></div><div class="fade"></div><div class="pill tag">{{tag|New drop}}</div><div class="h">{{handle|@projectkaizenclo}}</div>
<div class="t"><div class="d">{{headline|1% better <span class='acc'>every day</span>}}</div><div class="sub">{{sub|Move forward. Keep showing up.}}</div></div></body></html>
