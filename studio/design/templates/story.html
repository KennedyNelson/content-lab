<!doctype html><html><head><meta name="size" content="1080x1920"><meta charset="utf-8"><link rel="stylesheet" href="{{brand}}"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--fg);font-family:var(--font-body)}.d{font-family:var(--font-display);text-transform:uppercase;line-height:.92;letter-spacing:.01em}.acc{color:var(--accent)}.photo{background:var(--panel) center/cover no-repeat}.pill{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;text-transform:uppercase;letter-spacing:.08em}</style>
