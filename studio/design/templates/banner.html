<!doctype html><html><head><meta name="size" content="1920x600"><meta charset="utf-8"><link rel="stylesheet" href="{{brand}}"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--fg);font-family:var(--font-body)}.d{font-family:var(--font-display);text-transform:uppercase;line-height:.92;letter-spacing:.01em}.acc{color:var(--accent)}.photo{background:var(--panel) center/cover no-repeat}.pill{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;text-transform:uppercase;letter-spacing:.08em}</style>
<style>body{width:1920px;height:600px;position:relative;overflow:hidden}.photo{position:absolute;right:0;top:0;bottom:0;width:900px;background-image:url('{{image}}')}.fade{position:absolute;right:560px;top:0;bottom:0;width:340px;background:linear-gradient(90deg,var(--bg),transparent)}.t{position:absolute;left:110px;top:90px;width:1000px}.t .d{font-size:150px}.sub{font-size:36px;margin:22px 0 34px;font-weight:600}.cta{font-size:32px;padding:20px 44px}</style><style>.logo{background-position:center;background-size:contain;background-repeat:no-repeat;position:absolute}.logo{right:50px;bottom:36px;width:120px;height:97px}</style></head><body><div class="logo"></div>
<div class="photo"></div><div class="fade"></div><div class="t"><div class="d">{{headline|1% better <span class='acc'>every day</span>}}</div><div class="sub">{{sub|New drop is live.}}</div><span class="pill cta">{{cta|Shop now}}</span></div></body></html>
