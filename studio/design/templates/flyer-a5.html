<!doctype html><html><head><meta name="page" content="154x216mm"><meta charset="utf-8"><link rel="stylesheet" href="{{brand}}"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--fg);font-family:var(--font-body)}.d{font-family:var(--font-display);text-transform:uppercase;line-height:.92;letter-spacing:.01em}.acc{color:var(--accent)}.photo{background:var(--panel) center/cover no-repeat}.pill{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:800;text-transform:uppercase;letter-spacing:.08em}</style>
<style>@page{size:154mm 216mm;margin:0}body{width:154mm;height:216mm;position:relative;overflow:hidden}.photo{position:absolute;left:0;right:0;top:0;height:120mm;background-image:url('{{image}}')}.fade{position:absolute;left:0;right:0;top:80mm;height:42mm;background:linear-gradient(transparent,var(--bg))}.t{position:absolute;left:11mm;right:11mm;top:112mm}.t .d{font-size:21mm}.sub{font-size:5.2mm;margin:4mm 0;font-weight:600}.det{font-size:4.6mm;line-height:1.5;opacity:.92}.cta{font-size:4.6mm;padding:3mm 7mm;margin-top:4mm}.foot{position:absolute;left:11mm;right:11mm;bottom:9mm;font-size:4mm;display:flex;justify-content:space-between;font-weight:700}</style></head><body>
<!-- 3 mm bleed on every side: keep text 8 mm inside the trim line. Page = 148x210 trim + bleed. -->
<div class="photo"></div><div class="fade"></div><div class="t"><div class="d">{{headline|Strength over <span class='acc'>comfort</span>}}</div><div class="sub">{{sub|Activewear built for the grind.}}</div><div class="det">{{details|Tanks, tees and shorts. 1% better every day.}}</div><span class="pill cta">{{cta|projectkaizen.in}}</span></div>
<div class="foot"><span>{{handle|@projectkaizenclo}}</span><span>{{url|projectkaizen.in}}</span></div></body></html>
